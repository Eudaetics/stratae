[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratae"
description = "A toolkit of composable tools for dependency injection, lifecycle management, and more."
version = "0.0.1a3"
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Scott Wahl"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Eudaetics/stratae"
Repository = "https://github.com/Eudaetics/stratae"
Issues = "https://github.com/Eudaetics/stratae/issues"

[project.optional-dependencies]
dev = [
    "poethepoet>=0.35.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "radon>=6.0.1",
    "ruff>=0.12.2",
]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
]
asgi = [
    "httpx>=0.28.1",
    "fastapi>=0.100.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stratae*"]

[tool.setuptools.package-data]
stratae = ["py.typed"]

[tool.ruff]
lint.select = ["E", "F", "B", "I", "D", "S", "W"]
lint.ignore = ["D203", "D212", "B008"]
lint.external = ["S7497"]
line-length = 100


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # at least these three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "S311", # Not using cryptographic safe randomness in tests, just getting random values
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests/"
cache_dir = ".pytest_cache"
addopts = [
    "--cov=stratae/",
    "--cov-report=html:coverage/cov.html",
    "--no-cov-on-fail",
    "--cov-fail-under=100"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asgi: ASGI framework integration tests (requires fastapi, httpx)",
]

[tool.coverage.run]
omit = [
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:"
]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check --fix ."
typecheck = "pyright"
test = "pytest"
radon-cc = "radon cc stratae -n B"
radon-mi = "radon mi stratae -n B"

[tool.poe.tasks.no-cover-check]
shell = "! grep -rn --include='*.py' 'pragma: no cover' stratae"

[tool.poe.tasks.type-ignore-check]
shell = "! grep -rn --include='*.py' 'type: ignore' stratae"

[tool.poe.tasks.pyright-ignore-check]
shell = "! grep -rn --include='*.py' 'pyright: ignore' stratae"

[tool.poe.tasks.check]
sequence = [
    "format",
    "lint",
    "typecheck",
    "test",
    "no-cover-check",
    "type-ignore-check",
    "pyright-ignore-check",
    "radon-cc",
    "radon-mi",
]

[tool.pyright]
include = ["stratae", "tests"]
exclude = ["**/__pycache__"]

typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportUntypedFunctionDecorator = true

# Python version
pythonVersion = "3.12"
