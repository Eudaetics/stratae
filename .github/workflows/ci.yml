name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install
        run: pip install -e ".[dev,test,asgi,msgspec,rabbitmq]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: pyright

      - name: Test
        run: pytest

      - name: No coverage pragmas
        run: "! grep -rn --include='*.py' 'pragma: no cover' stratae"

      - name: No type ignores
        run: "! grep -rn --include='*.py' 'type: ignore' stratae"

      - name: No pyright ignores
        run: "! grep -rn --include='*.py' 'pyright: ignore' stratae"

  integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,msgspec,rabbitmq]"

      - name: Integration test
        run: pytest -m rabbitmq --no-cov
